[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sak-guard"
version = "0.1.0a0"
description = "Static pre-commit security guardrail for Solana Agent Kit and agent-client code. The static complement to a runtime transaction firewall."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Contact email deliberately omitted: no lab address exists yet. Add a real one
# before publishing to PyPI, and before it appears on the grant application.
authors = [{ name = "Pantronux Research (Lead: Irfan Achmad Firmansyah)" }]
keywords = ["solana", "security", "static-analysis", "solana-agent-kit", "linter", "guardrail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# ponytail: no runtime dependencies. The engine is stdlib-only by design, which is
# what makes it usable as a pre-commit hook without touching the caller's env.
dependencies = []

[project.optional-dependencies]
# The optional LLM intent-mismatch pass reads its provider from LLM_* env vars.
llm = ["openai>=1.0"]

[project.scripts]
sak-guard = "sak_guard.cli:main"

[project.urls]
Homepage = "https://github.com/Pantronux-Research/sak-guard"
Issues = "https://github.com/Pantronux-Research/sak-guard/issues"

[tool.setuptools]
packages = ["sak_guard"]
