name: publish

# Triggered by a published GitHub Release only. Deliberately NOT on a bare `v*` tag
# push: a tag push happens before the release exists, so it would upload to PyPI while
# the release is still a draft, and if both triggers were present a single release
# would publish twice. PyPI rejects a duplicate filename, so the failure would look
# like a network error rather than a trigger bug.
on:
  release:
    types: [published]
  workflow_dispatch: {}   # manual re-run, e.g. to retry a failed upload

permissions:
  contents: read           # default for every job; no write scope anywhere else

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the artifacts are installable and carry no junk
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Smoke test the exact wheel to be published
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --no-deps dist/*.whl
          release_python="$GITHUB_WORKSPACE/.release-venv/bin/python"
          cd "$(mktemp -d)"
          printf 'x=1\n' | "$release_python" -I -m sak_guard.cli - --json
          set +e
          printf 'x=llm.complete(q)\nPubkey(x)\n' | "$release_python" -I -m sak_guard.cli - --json > unsafe.json
          status=$?
          set -e
          test "$status" -eq 1
          "$release_python" -c 'import json; r=json.load(open("unsafe.json"))["reports"][0]; assert r["passed"] is False; assert any(i.get("pattern")=="PS-SOL-3" for i in r["issues"])'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    # The `environment` name MUST match the Environment field configured on the
    # PyPI Trusted Publisher page, otherwise the OIDC exchange is refused.
    environment:
      name: pypi
      url: https://pypi.org/p/sak-guard
    # id-token: write is what allows the job to mint the OIDC token PyPI exchanges
    # for a short-lived upload credential. It is scoped to this job only -- the build
    # job above must NOT have it. No API token or password is stored anywhere:
    # secrets.PYPI_API_TOKEN is intentionally absent.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` input. Supplying one would silently disable trusted
        # publishing and fall back to a long-lived token.
